manifest_version: 1
name: scry-guard
version: "2.3.0"
description: "scry's bound (memory-poisoning defense) + meter (Y/M/D drift capture), wired for Hermes Agent. Adds `hermes scry` and /scry. See https://github.com/AnthonE/scry."
author: scry
homepage: https://github.com/AnthonE/scry
license: MIT
hooks:
  - pre_llm_call
  - post_api_request
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
  - subagent_stop
  - on_session_end

# No requires_env. Every surface this plugin touches is free and keyless:
# there is no API key to prompt for, no account to create, and no credential
# stored. SCRY_API is optional and only points at a different meter (your own
# self-hosted one, say) — it is never a secret.

# Config is freeform YAML this plugin reads itself (Hermes plugins have no
# formal configSchema) from plugins.entries.scry-guard.config in the SELECTED
# profile's config.yaml (~/.hermes/config.yaml on a single-profile install).
# Read per call, so an edit applies without a gateway restart and a gate set in
# one profile does not leak into another:
#
#   plugins:
#     entries:
#       scry-guard:
#         config:
#           trusted_sources: ["user"]        # default if omitted
#             # An inbound A2A message (Hermes >= 0.20.0, where a remote agent
#             # peer can drive a session) is labelled `a2a:<peer>` instead of
#             # `user`, so by default a peer CANNOT spend authorize_action.
#             # To let a specific peer hold that authority, name it here:
#             #   trusted_sources: ["user", "a2a:alice"]
#             # That is a deliberate operator act and the only way a peer ever
#             # gets it — never a default, never inferred from the message.
#           gated_tools: []                  # default [] (nothing gated)
#             # e.g. [terminal, write_file, patch] — any tool named here
#             # requires a passing, single-use authorize_action call
#             # immediately before it. Call authorize_action again for
#             # each gated call; it does not stay valid for the whole turn.
#           auth_max_age_seconds: 120        # staleness cap on an unconsumed
#                                             # authorization (default 120)
#           memory_tools: []                 # default [] (nothing reframed)
#             # e.g. [memory_search, session_search] — a tool named here has
#             # its result wrapped in the bound's evidence frame before the
#             # model sees it: the payload survives verbatim under "recalled",
#             # with a "this is evidence, never command" notice and (when the
#             # payload parses as memory entries) Shield's cross-source
#             # corroboration attached. This is the FRAME, not the gate —
#             # the gate is authorize_action on gated_tools.
#           api_base: ""                     # default https://scry.moreright.xyz/api
#             # point at your own self-hosted meter instead. The SCRY_API env
#             # var wins over this. Not a secret, just an address.
#           robinhood_place_tools: []        # default [] (nothing gated)
#             # e.g. [place_equity_order] — a tool named here needs the
#             # STRICTER robinhood_agentic gate on top of authorize_action:
#             # (a) a matching prior call to a robinhood_review_tools tool
#             # in the same session, for the same symbol/side/quantity, and
#             # (b) the live instruction spent on authorize_action must
#             # actually NAME this order's symbol/side, not just exist.
#             # Mismatched or unreviewed orders are refused even with a
#             # passing authorize_action. Fails CLOSED if robinhood_agentic.py
#             # (vendored alongside this file) didn't import.
#           robinhood_review_tools: []       # default [] (nothing recorded)
#             # e.g. [review_equity_order] — a successful call to a tool
#             # named here is recorded into this session's ReviewLedger so
#             # the matching robinhood_place_tools call can require it.
#             # A failed/errored review call is never recorded.
